name: E2E

on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm knip
      - run: pnpm knip --production
      # ubuntu-latest already has the browser's system libraries; --with-deps would apt-get them again, which some runs
      # take over ten minutes to do
      - run: pnpm exec playwright install chromium
      - run: pnpm build
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
